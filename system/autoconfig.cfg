  // autoconfig.cfg — first line must be a comment
  try {
    function patchWindow(win) {
      if (win.location.href !== "chrome://browser/content/browser.xhtml") return;
      const tc = win.gBrowser?.tabContainer;
      if (!tc || tc._pinnedMclickPatched) return;
      tc._pinnedMclickPatched = true;

      const origOnClick = tc.on_click.bind(tc);
      tc.on_click = function(event) {
        // Wrapped in try/catch and using no ambient globals ON PURPOSE. This
        // runs inside Firefox's own on_click dispatch, so anything thrown here
        // takes the built-in handler down with it and MIDDLE-CLICK-TO-CLOSE
        // stops working on every tab. `Event` is not defined in the AutoConfig
        // scope — BUBBLING_PHASE off the event instance needs no global.
        try {
          if (event.eventPhase === event.BUBBLING_PHASE && event.button === 1) {
            const tab = event.target?.closest("tab");
            if (tab?.pinned) {
              event.preventDefault();
              event.stopPropagation();
              win.gBrowser.discardBrowser(tab);
              return;
            }
          }
        } catch (ex) {
          dump("autoconfig.cfg pinned-tab click failed: " + ex + "\n");
        }
        origOnClick(event);
      };
    }

    const ww = Cc["@mozilla.org/embedcomp/window-watcher;1"]
                 .getService(Ci.nsIWindowWatcher);
    const en = ww.getWindowEnumerator();
    while (en.hasMoreElements()) {
      const w = en.getNext();
      if (w.gBrowser) patchWindow(w);
      else w.addEventListener("load", () => patchWindow(w), { once: true });
    }
    ww.registerNotification({
      observe(subject, topic) {
        if (topic === "domwindowopened") {
          // subject is already a window in modern Firefox; calling
          // QueryInterface on it throws, so the pinned-tab patch never applied
          // to newly opened windows.
          subject.addEventListener("load", () => patchWindow(subject), {
            once: true,
          });
        }
      }
    });
  } catch(ex) {
    dump("autoconfig.cfg pinned-tab patch failed: " + ex + "\n");
  }

  // --- vimfox loader -------------------------------------------------------
  // AutoConfig is install-wide, so gate on a marker file that only the vimfox
  // profile has. Your default-release profile falls straight through.
  try {
    const profDir = Cc["@mozilla.org/file/directory_service;1"]
                      .getService(Ci.nsIProperties)
                      .get("ProfD", Ci.nsIFile);
    const marker = profDir.clone();
    marker.append(".vimfox");
    if (marker.exists()) {
      const boot = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
      boot.initWithPath("/home/thomal/.vimfox/boot.js");
      const ios = Cc["@mozilla.org/network/io-service;1"]
                    .getService(Ci.nsIIOService);
      Cc["@mozilla.org/moz/jssubscript-loader;1"]
        .getService(Ci.mozIJSSubScriptLoader)
        .loadSubScript(ios.newFileURI(boot).spec, this);
    }
  } catch(ex) {
    dump("vimfox loader failed: " + ex + "\n");
  }
