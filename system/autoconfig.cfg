  // autoconfig.cfg — first line must be a comment
  //
  // AutoConfig is INSTALL-WIDE: this runs for every Firefox profile on the
  // machine. Everything below is gated on a marker file that only a vimfox
  // profile has.
  let isVimfoxProfile = false;
  try {
    const profDir = Cc["@mozilla.org/file/directory_service;1"]
                      .getService(Ci.nsIProperties)
                      .get("ProfD", Ci.nsIFile);
    const marker = profDir.clone();
    marker.append(".vimfox");
    isVimfoxProfile = marker.exists();
  } catch(ex) {
    dump("autoconfig.cfg marker check failed: " + ex + "\n");
  }

  // --- vimfox loader -------------------------------------------------------
  try {
    if (isVimfoxProfile) {
      const dir = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
      dir.initWithPath("/home/thomal/.vimfox");
      const ios = Cc["@mozilla.org/network/io-service;1"]
                    .getService(Ci.nsIIOService);
      // FF155 (bug 1974213) refuses file: and jar: in loadSubScript, so the
      // substitution is registered HERE rather than in boot.js — which could no
      // longer be reached to register it. resource: is still a trusted scheme.
      ios.getProtocolHandler("resource")
         .QueryInterface(Ci.nsISubstitutingProtocolHandler)
         .setSubstitution("vimfox", ios.newFileURI(dir));
      Cc["@mozilla.org/moz/jssubscript-loader;1"]
        .getService(Ci.mozIJSSubScriptLoader)
        .loadSubScript("resource://vimfox/boot.js", this);
    }
  } catch(ex) {
    dump("vimfox loader failed: " + ex + "\n");
  }
