  // autoconfig.cfg — first line must be a comment
  //
  // AutoConfig is INSTALL-WIDE: this runs for every profile of this browser on
  // the machine. Everything vimfox does below is gated on a marker file that
  // only a vimfox profile has.

  // Run <dir>/<name> as a script with `target` as its global. Through a
  // temporary resource: substitution, because FF155 refuses file: in
  // loadSubScript; removed again so no profile is left with it.
  const loadFromDir = (dir, name, target) => {
    const res = Services.io.getProtocolHandler("resource")
                  .QueryInterface(Ci.nsISubstitutingProtocolHandler);
    res.setSubstitution("vimfox-tmp", Services.io.newFileURI(dir));
    try {
      Services.scriptloader.loadSubScript("resource://vimfox-tmp/" + name, target);
    } finally {
      res.setSubstitution("vimfox-tmp", null);
    }
  };

  // --- vendor config -------------------------------------------------------
  // There is only ONE general.config.filename. LibreWolf already uses it for
  // librewolf.cfg — its whole privacy configuration — and our autoconfig.js
  // repoints it here, so we have to run theirs ourselves or every LibreWolf
  // profile on the machine silently loses it. Firefox has no such file, so
  // this does nothing there.
  //
  // resource://gre/ is no help here — with an omnijar it points INSIDE
  // omni.ja, and the .cfg sits next to it on disk.
  try {
    const gre = Services.dirsvc.get("GreD", Ci.nsIFile);
    const vendor = gre.clone();
    vendor.append("librewolf.cfg");
    if (vendor.exists()) loadFromDir(gre, "librewolf.cfg", this);
  } catch(ex) {
    dump("autoconfig.cfg vendor config failed: " + ex + "\n");
  }

  // --- vimfox marker -------------------------------------------------------
  // <profile>/.vimfox turns vimfox on for that profile. Empty means the
  // profile is <checkout>/profile, as run.sh launches it, so the checkout is
  // its parent. Otherwise it holds the checkout's path (a leading ~/ is your
  // home) — that is how an ordinary profile elsewhere gets vimfox too.
  let profDir = null;
  let vimfoxDir = null;
  try {
    profDir = Services.dirsvc.get("ProfD", Ci.nsIFile);
    const marker = profDir.clone();
    marker.append(".vimfox");
    if (marker.exists()) {
      // IOUtils is not in AutoConfig scope; streams are.
      const stream = Cc["@mozilla.org/network/file-input-stream;1"]
                       .createInstance(Ci.nsIFileInputStream);
      stream.init(marker, -1, 0, 0);
      const sis = Cc["@mozilla.org/scriptableinputstream;1"]
                    .createInstance(Ci.nsIScriptableInputStream);
      sis.init(stream);
      const path = sis.read(sis.available()).trim();
      sis.close();
      if (!path) {
        vimfoxDir = profDir.parent;
      } else {
        vimfoxDir = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
        if (path.startsWith("~/")) {
          vimfoxDir.initWithPath(Services.dirsvc.get("Home", Ci.nsIFile).path);
          vimfoxDir.appendRelativePath(path.slice(2));
        } else {
          vimfoxDir.initWithPath(path);
        }
      }
    }
  } catch(ex) {
    dump("autoconfig.cfg marker check failed: " + ex + "\n");
  }

  // --- vimfox loader -------------------------------------------------------
  try {
    if (vimfoxDir) {
      // A cfg's pref() sets the USER value and runs after user.js, so it wins.
      // librewolf.cfg pref()s browser.dom.window.dump.enabled to false, which
      // silences every dump() — the self-test result included — and looks
      // exactly like vimfox not loading. Re-apply the profile's OWN user.js on
      // top so it means the same thing under every vendor config. Never the
      // checkout's profile/user.js: that is the test profile's, and would push
      // its homepage and sidebar onto an ordinary profile every startup.
      const userJs = profDir.clone();
      userJs.append("user.js");
      if (userJs.exists()) {
        const prefFn = pref;
        try {
          loadFromDir(profDir, "user.js",
                      { user_pref: (name, value) => prefFn(name, value) });
        } catch(ex) {
          dump("vimfox user.js re-apply failed: " + ex + "\n");
        }
      }
      // FF155 (bug 1974213) refuses file: and jar: in loadSubScript, so the
      // substitution is registered HERE rather than in boot.js — which could no
      // longer be reached to register it. resource: is still a trusted scheme.
      Services.io.getProtocolHandler("resource")
        .QueryInterface(Ci.nsISubstitutingProtocolHandler)
        .setSubstitution("vimfox", Services.io.newFileURI(vimfoxDir));
      Services.scriptloader.loadSubScript("resource://vimfox/boot.js", this);
    }
  } catch(ex) {
    dump("vimfox loader failed: " + ex + "\n");
  }
